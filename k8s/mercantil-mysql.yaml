
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: mercantil-db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mercantil-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mercantil-db
  template:
    metadata:
      labels:
        app: mercantil-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: mercantil
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mercantil-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mercantil-mysql-pvc
